// Top-level build file
plugins {
    id("com.android.application") version "8.5.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}

// Fully-offline build: pin transitive Kotlin stdlib artifacts to versions
// present in the local repo (the sandbox blocks Java HTTP, so Gradle cannot
// fetch the versions some POMs request).
allprojects {
    configurations.all {
        resolutionStrategy {
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20")
        }
    }
}
